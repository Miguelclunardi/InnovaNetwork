# Multus (rke2-multus chart) adjusted to the k3s folders.
# Gives a 2nd interface (net1) to the pods that ask for it; used for the AMF (N2) and UPF (N3) on the gNB link.
# Install: helm upgrade --install multus rke2-multus --repo https://rke2-charts.rancher.io \
#               --version v4.3.110 -n kube-system -f helm/multus/values.yaml
# First, the CRD (the chart does not ship it): kubectl apply -f helm/multus/crd.yaml
config:
  fullnameOverride: multus
  cni_conf:
    confDir: /var/lib/rancher/k3s/agent/etc/cni/net.d
    multusAutoconfigDir: /var/lib/rancher/k3s/agent/etc/cni/net.d   # where k3s writes 10-flannel.conflist
    binDir: /var/lib/rancher/k3s/data/cni/
    kubeconfig: /var/lib/rancher/k3s/agent/etc/cni/net.d/multus.d/multus.kubeconfig
