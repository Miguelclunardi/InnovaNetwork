# Rede "ran-link": macvlan sobre a porta de fibra do torre2 (enp5s0f1, link 10.10.0.0/24 com o innovaserver).
# O IP de cada pod vem da anotação dele (IPAM static com capability "ips"), ex.:
#   k8s.v1.cni.cncf.io/networks: [{"name":"ran-link","ips":["10.10.0.10/24"]}]
# Observação: no macvlan o próprio host (10.10.0.2) NÃO enxerga os pods; o innovaserver sim.
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: ran-link
  namespace: open5gs
spec:
  config: |-
    {
      "cniVersion": "0.3.1",
      "type": "macvlan",
      "master": "enp5s0f1",
      "mode": "bridge",
      "mtu": 9000,
      "ipam": { "type": "static" },
      "capabilities": { "ips": true }
    }
